plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
    id 'org.spongepowered.mixin' version "${mixin_gradle_version}"
    id 'com.gradleup.shadow' version "${shadow_version}"
    id 'com.vanniktech.maven.publish' version "${maven_publish_version}"
}

version = mod_stage != "" ? "${mc_version}-${mod_version}-${mod_stage}" : "${mc_version}-${mod_version}"
group = mod_group
archivesBaseName = mod_name

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: "${mappings_channel}", version: "${mappings_version}"

    runs {
        client {
            taskName "runClient ${mod_name} ${mc_version}"
            environment 'MC_VERSION', "${mc_version}"
            property 'fml.coreMods.load', "${mod_plugin_class}"
        }

        server {
            taskName "runServer ${mod_name} ${mc_version}"
            environment 'MC_VERSION', "${mc_version}"
            property 'fml.coreMods.load', "${mod_plugin_class}"
        }
    }
}

configurations {
    implementation.extendsFrom(shadow)
}

repositories {
    ivy {
        url 'https://github.com/'

        patternLayout {
            artifact '[organisation]/[module]/releases/download/v[revision]/[module]-[revision].[ext]'
        }

        metadataSources { artifact() } 
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
    implementation "org.spongepowered:mixin:${mixin_version}"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
    shadow "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    shadow 'meldexun:ASMUtil:2.8.0@jar'
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

processResources {
    inputs.property('version', mod_stage != "" ? "${mod_version}-${mod_stage}" : "${mod_version}")

    filesMatching('mcmod.info') {
        expand version: inputs.properties.get('version')
    }
}

java {
    withSourcesJar()
}

jar {
    archiveBaseName = mod_name
    archiveAppendix = mc_version
    archiveVersion = mod_version
    archiveClassifier = mod_stage != "" ? mod_stage + '-thin' : 'thin'

    manifest {
        attributes 'FMLCorePlugin': "${mod_plugin_class}"
        attributes 'FMLCorePluginContainsFMLMod': 'true'
        attributes 'ForceLoadAsMod': 'true'
        attributes 'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker'
        attributes 'TweakOrder': '0'
        attributes 'MixinConfigs': "mixins.${mod_id}.json"
    }
}

jar.finalizedBy('reobfJar')

shadowJar {
    archiveClassifier = ''

    configurations = [project.configurations.shadow]
    mergeServiceFiles()

    relocate 'com.llamalad7.mixinextras', "${mod_group}.mixinextras"
}

reobf {
    shadowJar {}
}

shadowJar.finalizedBy('reobfShadowJar')

mavenPublishing {
    coordinates("io.github.meldexun", "betterconfig", version)

    pom {
        name = "Better Config"
        description = "Extension to Minecraft Forge's annotation-based config system."
        inceptionYear = "2026"
        url = "https://github.com/Meldexun/BetterConfig"
        licenses {
            license {
                name = "The MIT License"
                url = "https://opensource.org/license/mit"
                distribution = "https://opensource.org/license/mit"
            }
        }
        developers {
            developer {
                id = "meldexun"
                name = "Meldexun"
                url = "https://github.com/Meldexun"
            }
        }
        scm {
            url = "https://github.com/Meldexun/BetterConfig/"
            connection = "scm:git:git://github.com/Meldexun/BetterConfig.git"
            developerConnection = "scm:git:ssh://git@github.com/Meldexun/BetterConfig.git"
        }
    }

    publishToMavenCentral()
    signAllPublications()
}
